<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${movie.title}">Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<nav class="navbar navbar-expand mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">MOVIE RECOMMENDER</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/malayalam">Malayalam</a></li>
            <li class="nav-item"><a class="nav-link" href="/analysis">Analysis</a></li>
            <li class="nav-item"><a class="nav-link" href="/evaluate">Evaluation</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <img class="detail-poster" alt="poster"
                 th:src="@{/poster/{id}(id=${movie.id})}"
                 onerror="this.onerror=null;this.src='/no-poster.svg'">
        </div>
        <div class="col-md-8">
            <h1 th:text="${movie.title}">Title</h1>
            <div class="my-3">
                <span class="badge bg-danger me-1 fs-6"
                      th:each="g : ${#strings.arraySplit(movie.genres,'|')}" th:text="${g}">Genre</span>
            </div>
            <p class="fs-5">
                <span class="score-badge">Average rating:
                    <span th:text="${#numbers.formatDecimal(average,1,2)}">0</span> / 5</span>
            </p>
        </div>
    </div>

    <h4 class="mb-3">Similar movies</h4>
    <div class="row row-cols-2 row-cols-md-4 row-cols-xl-6 g-3">
        <div class="col" th:each="s : ${similar}">
            <div class="card movie-card">
                <img class="poster" loading="lazy" alt="poster"
                     th:src="@{/poster/{id}(id=${s.movie.id})}"
                     onerror="this.onerror=null;this.src='/no-poster.svg'">
                <div class="card-body p-2">
                    <a th:href="@{/movie/{id}(id=${s.movie.id})}" class="movie-title stretched-link"
                       th:text="${s.movie.title}">Title</a>
                    <div class="genre-text my-1"
                         th:text="${#strings.replace(s.movie.genres,'|',', ')}">Genres</div>
                    <span class="score-badge">Similarity:
                        <span th:text="${#numbers.formatDecimal(s.score,1,1)}">0</span>%</span>
                </div>
            </div>
        </div>
    </div>

    <p class="footer-note">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</div>
</body>
</html>
