<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<nav class="navbar navbar-expand mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">MOVIE RECOMMENDER</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/malayalam">Malayalam</a></li>
            <li class="nav-item"><a class="nav-link" href="/analysis">Analysis</a></li>
            <li class="nav-item"><a class="nav-link" href="/evaluate">Evaluation</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="hero">
        <h2 class="mb-3">Find your next favourite movie</h2>
        <div class="row g-3">
            <div class="col-md-6">
                <form action="/" method="get" class="d-flex gap-2">
                    <input name="q" th:value="${q}" class="form-control" placeholder="Search movies...">
                    <button class="btn btn-dark">Search</button>
                </form>
            </div>
            <div class="col-md-6">
                <form action="/recommend" method="get" class="d-flex gap-2">
                    <input name="userId" type="number" min="1" max="610" class="form-control"
                           placeholder="User ID (1 to 610)" required>
                    <button class="btn btn-light">Recommend for me</button>
                </form>
            </div>
        </div>
    </div>

    <h4 class="mb-3" th:text="${title}">Title</h4>

    <div class="row row-cols-2 row-cols-md-4 row-cols-xl-6 g-3">
        <div class="col" th:each="s : ${movies}">
            <div class="card movie-card">
