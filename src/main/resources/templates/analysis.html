<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dataset Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="bg-white">
<div class="container py-4">
    <a href="/" class="btn btn-outline-dark mb-3">&larr; Home</a>
    <h2 class="mb-4">MovieLens Dataset Analysis</h2>

    <div class="row g-3 mb-4 text-center">
        <div class="col-6 col-md-3"><div class="border rounded p-3">
            <div class="fs-3" th:text="${numUsers}">0</div><div class="text-muted">Users</div></div></div>
        <div class="col-6 col-md-3"><div class="border rounded p-3">
            <div class="fs-3" th:text="${numMovies}">0</div><div class="text-muted">Movies</div></div></div>
        <div class="col-6 col-md-3"><div class="border rounded p-3">
            <div class="fs-3" th:text="${numRatings}">0</div><div class="text-muted">Ratings</div></div></div>
        <div class="col-6 col-md-3"><div class="border rounded p-3">
            <div class="fs-3" th:text="${#numbers.formatDecimal(avgRating,1,2)}">0</div>
            <div class="text-muted">Average rating</div></div></div>
    </div>
    <p class="text-muted">Matrix sparsity:
        <b th:text="${#numbers.formatDecimal(sparsity,1,2)}">0</b>% of possible user-movie ratings are missing.</p>

    <div class="row g-4">
        <div class="col-md-6"><h5>Rating distribution</h5><canvas id="c1"></canvas></div>
        <div class="col-md-6"><h5>Top 10 genres (number of movies)</h5><canvas id="c2"></canvas></div>
        <div class="col-12"><h5>Top 10 most rated movies</h5><canvas id="c3" height="110"></canvas></div>
    </div>
</div>

<script th:inline="javascript">
    const ratingLabels = /*[[${ratingLabels}]]*/ [];
    const ratingValues = /*[[${ratingValues}]]*/ [];
    const genreLabels = /*[[${genreLabels}]]*/ [];
    const genreValues = /*[[${genreValues}]]*/ [];
    const movieLabels = /*[[${movieLabels}]]*/ [];
    const movieValues = /*[[${movieValues}]]*/ [];

    new Chart(document.getElementById('c1'), {
        type: 'bar',
        data: { labels: ratingLabels,
                datasets: [{ label: 'Number of ratings', data: ratingValues, backgroundColor: '#dc3545' }] }
    });
    new Chart(document.getElementById('c2'), {
        type: 'bar',
        data: { labels: genreLabels,
                datasets: [{ label: 'Number of movies', data: genreValues, backgroundColor: '#0d6efd' }] },
        options: { indexAxis: 'y' }
    });
    new Chart(document.getElementById('c3'), {
        type: 'bar',
        data: { labels: movieLabels,
                datasets: [{ label: 'Number of ratings', data: movieValues, backgroundColor: '#198754' }] },
        options: { indexAxis: 'y' }
    });
</script>
</body>
</html>
